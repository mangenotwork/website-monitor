<!doctype html>
<html lang="zh-CN" data-accent="indigo" data-density="cozy">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <link rel="icon" href="/static/bootstrap/img/outlet.svg">
    <title>{[ .Title ]}</title>
    <link href="/static/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/theme.css?v={[ .TimeStamp ]}" rel="stylesheet">
    <script>
        (function () {
            try {
                var accent = localStorage.getItem('wm.accent');
                var density = localStorage.getItem('wm.density');
                if (accent) document.documentElement.setAttribute('data-accent', accent);
                if (density) document.documentElement.setAttribute('data-density', density);
            } catch (e) { }
        })();
    </script>
</head>
