<div class="modal fade" id="setAlertModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="setAlertModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h1 class="modal-title" id="setAlertModalLabel">{{ editWebsiteConf.base.host }} · 监测设置</h1>
                    <div class="hint" style="margin-top:2px">修改后会立即通知探针更新配置</div>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
            </div>
            <div class="modal-body">
                <div class="form-section">
                    <div class="st">基础信息</div>
                    <div class="form-grid">
                        <div class="field">
                            <label>监测网站</label>
                            <input type="text" class="input" v-model="editWebsiteConf.base.host" disabled>
                        </div>
                        <div class="field">
                            <label>备注</label>
                            <input type="text" class="input" v-model="editWebsiteConf.base.notes">
                        </div>
                        <div class="field">
                            <label>监测频率</label>
                            <input type="number" class="input" v-model="editWebsiteConf.base.monitorRate" min="5">
                            <div class="hint">单位秒。</div>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <div class="st">健康校验</div>
                    <div class="form-grid">
                        <div class="field">
                            <label>对照组 URL</label>
                            <input type="text" class="input" v-model="editWebsiteConf.base.contrastUrl">
                        </div>
                        <div class="field">
                            <label>对照组阈值</label>
                            <input type="number" class="input" v-model="editWebsiteConf.base.contrastTime">
                            <div class="hint">单位毫秒。</div>
                        </div>
                        <div class="field">
                            <label>Ping 地址</label>
                            <input type="text" class="input" v-model="editWebsiteConf.base.ping">
                        </div>
                        <div class="field">
                            <label>Ping 阈值</label>
                            <input type="number" class="input" v-model="editWebsiteConf.base.pingTime">
                            <div class="hint">单位毫秒。</div>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <div class="st">采集设置</div>
                    <div class="form-grid">
                        <div class="field">
                            <label>扫描深度</label>
                            <input type="number" class="input" v-model="editWebsiteConf.scanCheckUp.uriDepth" min="1">
                        </div>
                        <div class="field">
                            <label>扫描频率</label>
                            <input type="number" class="input" v-model="editWebsiteConf.scanCheckUp.scanRate" min="1">
                            <div class="hint">单位小时。</div>
                        </div>
                        <div class="field full">
                            <label>扫描项</label>
                            <div class="check-row" style="margin-top:4px">
                                <label><input class="cb" type="checkbox" v-model="editWebsiteConf.scanCheckUp.scanBadLink"> 死链检查</label>
                                <label><input class="cb" type="checkbox" v-model="editWebsiteConf.scanCheckUp.scanTDK"> TDK 为空检查</label>
                                <label><input class="cb" type="checkbox" v-model="editWebsiteConf.scanCheckUp.scanExtLinks"> 外链变化检查</label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-section" style="margin-bottom:0">
                    <div class="st">报警设置</div>
                    <div class="form-grid">
                        <div class="field">
                            <label>慢响应阈值</label>
                            <input type="number" class="input" v-model="editWebsiteConf.alarmRule.websiteSlowResponseTime">
                            <div class="hint">单位毫秒，超过则记录报警。</div>
                        </div>
                        <div class="field">
                            <label>连续几次慢发送通知</label>
                            <input type="number" class="input" v-model="editWebsiteConf.alarmRule.websiteSlowResponseCount" min="1">
                        </div>
                        <div class="field">
                            <label>证书到期阈值</label>
                            <input type="number" class="input" v-model="editWebsiteConf.alarmRule.SSLCertificateExpire" min="1">
                            <div class="hint">单位天。</div>
                        </div>
                    </div>
                    <div class="note" style="margin-top:12px">
                        <svg class="icon sm"><use href="#i-alert"/></svg>
                        <span>响应状态码 400 / 404 / 5xx 默认触发报警；扫描类检查发现的问题也会发送通知邮件。</span>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn primary" @click="editWebsiteConfSubmit()">保存设置</button>
            </div>
        </div>
    </div>
</div>
