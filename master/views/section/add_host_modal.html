<div class="modal fade" id="addHostModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="addHostModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-wide">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h1 class="modal-title" id="addHostModalLabel">创建监测</h1>
                    <div class="hint" style="margin-top:2px">创建后自动采集站点信息，并下发至在线探针</div>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
            </div>
            <div class="modal-body">
                <div class="form-section">
                    <div class="st">基础信息</div>
                    <div class="form-grid">
                        <div class="field full">
                            <label>站点地址</label>
                            <div style="display:flex;gap:8px">
                                <select class="input" style="width:104px;flex:0 0 104px" v-model="webSite.next1Param.hostProtocol">
                                    <option value="https://">https://</option>
                                    <option value="http://">http://</option>
                                </select>
                                <input type="text" class="input" v-model="webSite.next1Param.hostUrl" placeholder="www.example.com">
                            </div>
                            <div class="hint">需可从公网访问，创建前会自动校验状态码。</div>
                        </div>
                        <div class="field">
                            <label>备注</label>
                            <input type="text" class="input" v-model="webSite.next1Param.notes" placeholder="例如：主站 PC 端">
                        </div>
                        <div class="field">
                            <label>监测频率</label>
                            <input type="number" class="input" v-model="webSite.next1Param.monitorRate" min="5">
                            <div class="hint">单位秒，最小 5 秒。</div>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <div class="st">健康校验</div>
                    <div class="form-grid">
                        <div class="field">
                            <label>对照组 URL</label>
                            <input type="text" class="input" v-model="webSite.next1Param.contrastUrl">
                            <div class="hint">每轮监测前先请求对照组，确认探针出口正常。</div>
                        </div>
                        <div class="field">
                            <label>对照组阈值</label>
                            <input type="number" class="input" v-model="webSite.next1Param.contrastTime">
                            <div class="hint">单位毫秒，超过则本轮不监测。</div>
                        </div>
                        <div class="field">
                            <label>Ping 地址</label>
                            <input type="text" class="input" v-model="webSite.next1Param.ping">
                        </div>
                        <div class="field">
                            <label>Ping 阈值</label>
                            <input type="number" class="input" v-model="webSite.next1Param.pingTime">
                            <div class="hint">单位毫秒。</div>
                        </div>
                    </div>
                </div>

                <details class="adv">
                    <summary>采集与告警<span class="tag neutral">可选</span></summary>
                    <div class="form-grid" style="margin-top:12px">
                        <div class="field">
                            <label>扫描深度</label>
                            <input type="number" class="input" v-model="webSite.next2Param.uriDepth" min="1">
                        </div>
                        <div class="field">
                            <label>扫描频率</label>
                            <input type="number" class="input" v-model="webSite.next2Param.scanRate" min="1">
                            <div class="hint">单位小时。</div>
                        </div>
                        <div class="field">
                            <label>慢响应阈值</label>
                            <input type="number" class="input" v-model="webSite.next3Param.websiteSlowResponseTime">
                            <div class="hint">单位毫秒，低于 100ms 不允许提交。</div>
                        </div>
                        <div class="field">
                            <label>连续几次慢发送通知</label>
                            <input type="number" class="input" v-model="webSite.next3Param.websiteSlowResponseCount" min="1">
                        </div>
                        <div class="field">
                            <label>证书到期阈值</label>
                            <input type="number" class="input" v-model="webSite.next3Param.SSLCertificateExpire" min="1">
                            <div class="hint">单位天。</div>
                        </div>
                        <div class="field">
                            <label>扫描项</label>
                            <div class="check-row" style="margin-top:4px">
                                <label><input class="cb" type="checkbox" v-model="webSite.next2Param.scanBadLink"> 死链</label>
                                <label><input class="cb" type="checkbox" v-model="webSite.next2Param.scanTDK"> TDK</label>
                                <label><input class="cb" type="checkbox" v-model="webSite.next2Param.scanExtLinks"> 外链变化</label>
                            </div>
                        </div>
                    </div>
                </details>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn primary" @click="webSite.addSubmit">创建监测</button>
            </div>
        </div>
    </div>
</div>
