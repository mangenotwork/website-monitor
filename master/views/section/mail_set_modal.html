<div class="modal fade" id="mailSetModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="mailSetModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width:560px">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h1 class="modal-title" id="mailSetModalLabel">邮件与通知</h1>
                    <div class="hint" style="margin-top:2px">报警邮件通过该 SMTP 账号发送</div>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
            </div>
            <div class="modal-body">
                <div class="form-grid">
                    <div class="field">
                        <label>邮件服务器</label>
                        <input type="text" class="input" v-model="mail.param.host" placeholder="smtp.qq.com">
                    </div>
                    <div class="field">
                        <label>端口</label>
                        <input type="number" class="input" v-model="mail.param.port" placeholder="465 / 587 / 25">
                    </div>
                    <div class="field">
                        <label>发件人</label>
                        <input type="text" class="input" v-model="mail.param.from" placeholder="alert@example.com">
                    </div>
                    <div class="field">
                        <label>授权码</label>
                        <input type="password" class="input" v-model="mail.param.authCode" placeholder="SMTP 授权码">
                    </div>
                    <div class="field full">
                        <label>收件人</label>
                        <textarea class="input" rows="2" v-model="mail.param.toList" placeholder="多个收件人用分号 ; 隔开"></textarea>
                    </div>
                    <div class="field full">
                        <label class="check-row" style="margin:0">
                            <span><input class="cb" type="checkbox" v-model="mail.param.open"> 开启邮件通知</span>
                        </label>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn secondary" @click="mail.send()">测试发送并保存</button>
                <button type="button" class="btn primary" @click="mail.setConf()">保存</button>
            </div>
        </div>
    </div>
</div>
